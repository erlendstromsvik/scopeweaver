# D.5a test fixture — a blueprint whose secrets are file refs, as an
# ephemeral instance requires (owner decision D6). Mirrors the shape of
# blueprint/examples/example.yaml, trimmed to what the launch script checks.
version: 1
name: fixture-com
authorization:
  authorized_by: "Test Controller"
  window:
    start: 2026-10-20
    end: 2026-10-24
  reference: "ENG-TEST"
company:
  name: Fixture Corp
scope:
  - { kind: domain, value: example.com }
constraints:
  - kind: allow
    text: "Only example.com."
task:
  goal: "Mapping only."
  timeout_seconds: 3600
runtime:
  workers: 1
  llm_max_concurrent: 1
llm:
  provider: ollama
  model: test-model
  base_url: http://host.docker.internal:11434
admin:
  username: ARTEX
  password: ${file:/run/secrets/admin_password}
