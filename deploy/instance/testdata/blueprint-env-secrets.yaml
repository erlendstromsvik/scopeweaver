# D.5a test fixture — a blueprint that still uses an ${env:…} ref for the
# admin password. The launch script must refuse it (D6: instances use file
# secrets, not the host environment).
version: 1
name: envref-com
authorization:
  authorized_by: "Test Controller"
  window:
    start: 2026-10-20
    end: 2026-10-24
  reference: "ENG-TEST"
company:
  name: EnvRef Corp
scope:
  - { kind: domain, value: example.com }
task:
  goal: "Mapping only."
  timeout_seconds: 3600
runtime:
  workers: 1
  llm_max_concurrent: 1
llm:
  provider: ollama
  model: test-model
  base_url: http://host.docker.internal:11434
admin:
  username: ARTEX
  password: ${env:SW_ADMIN_PASSWORD}
