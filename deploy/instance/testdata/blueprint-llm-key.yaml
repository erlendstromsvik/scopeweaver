# D.5a test fixture — like blueprint-file-secrets.yaml, but the LLM block
# reads its key from /run/secrets/llm_api_key, so launch needs a key file.
version: 1
name: fixture-com
authorization:
  authorized_by: "Test Controller"
  window:
    start: 2026-10-20
    end: 2026-10-24
  reference: "ENG-TEST"
company:
  name: Fixture Corp
scope:
  - { kind: domain, value: example.com }
constraints:
  - kind: allow
    text: "Only example.com."
task:
  goal: "Mapping only."
  timeout_seconds: 3600
runtime:
  workers: 1
  llm_max_concurrent: 1
llm:
  provider: openai-compatible
  model: test-model
  base_url: http://host.docker.internal:8090/v1
  api_key: ${file:/run/secrets/llm_api_key}
admin:
  username: ARTEX
  password: ${file:/run/secrets/admin_password}
